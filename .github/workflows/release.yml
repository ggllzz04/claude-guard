name: Prepare release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v1.2.5)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Verify version and source privacy
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          git diff --check
          python3 scripts/check-privacy.py
          bash scripts/test.sh
      - name: Package
        run: bash scripts/package-release.sh
      - name: Run isolated safety checks
        run: |
          BIN="$(swift build -c release --show-bin-path)"
          "$BIN/GuardBench" --self-test
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" build/release/* \
            --verify-tag --draft \
            --title "Route Guard $RELEASE_TAG" \
            --notes-file docs/release-notes.md
