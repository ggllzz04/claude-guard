name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check repository hygiene
        run: |
          git diff --check
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m py_compile scripts/*.py
          for plist in config/*.plist; do plutil -lint "$plist"; done
          python3 scripts/check-privacy.py
          python3 -c "from pathlib import Path; assert 'claude' not in Path('README.md').read_text().casefold()"
      - name: Run unit tests
        run: bash scripts/test.sh
      - name: Build release application
        run: bash scripts/build-app.sh
      - name: Run isolated safety checks
        run: |
          BIN="$(swift build -c release --show-bin-path)"
          "$BIN/GuardBench" --self-test
      - name: Check bundled files for private data
        run: python3 scripts/check-privacy.py "build/Route Guard.app"
