# Route Guard · Clash Verge Merge 配置
#
# 在 Clash Verge 中新建/导入一个 Merge 类型配置，文件名 RouteGuard.yaml，
# 将下方所有规则中的 🤖 AI 改为你的实际 Selector 名称，并在 Route Guard
# 的「设置 → 目标策略组」应用同一名称，然后右键启用 Merge。订阅更新不会覆盖它。
#
# 作用：
#   1. 把 Claude / Anthropic / 常见遥测域名放到规则最前面，走指定 Selector（此模板默认 🤖 AI）
#   2. 关闭局域网代理，只监听 127.0.0.1
#   3. 开启 TLS/QUIC SNI 嗅探
#

prepend-rules:
  # Claude / Anthropic
  - DOMAIN-SUFFIX,anthropic.com,🤖 AI
  - DOMAIN-SUFFIX,anthropic.ai,🤖 AI
  - DOMAIN-SUFFIX,claude.ai,🤖 AI
  - DOMAIN-SUFFIX,claude.com,🤖 AI
  - DOMAIN-SUFFIX,claudeusercontent.com,🤖 AI
  - DOMAIN-SUFFIX,claudemcpcontent.com,🤖 AI
  - DOMAIN-KEYWORD,claude,🤖 AI
  - DOMAIN-KEYWORD,anthropic,🤖 AI

  # 第三方遥测 / 审计
  - DOMAIN-SUFFIX,sentry.io,🤖 AI
  - DOMAIN-SUFFIX,sentry-cdn.com,🤖 AI
  - DOMAIN-SUFFIX,statsig.com,🤖 AI
  - DOMAIN-SUFFIX,statsigapi.net,🤖 AI
  - DOMAIN-SUFFIX,featuregates.org,🤖 AI
  - DOMAIN-SUFFIX,featureassets.org,🤖 AI
  - DOMAIN-SUFFIX,segment.io,🤖 AI
  - DOMAIN-SUFFIX,segment.com,🤖 AI
  - DOMAIN-SUFFIX,amplitude.com,🤖 AI
  - DOMAIN-SUFFIX,datadoghq.com,🤖 AI
  - DOMAIN-SUFFIX,datadoghq.eu,🤖 AI
  - DOMAIN-SUFFIX,newrelic.com,🤖 AI
  - DOMAIN-SUFFIX,nr-data.net,🤖 AI
  - DOMAIN-SUFFIX,bugsnag.com,🤖 AI
  - DOMAIN-SUFFIX,logrocket.com,🤖 AI
  - DOMAIN-SUFFIX,lr-ingest.io,🤖 AI
  - DOMAIN-SUFFIX,fullstory.com,🤖 AI
  - DOMAIN-SUFFIX,hotjar.com,🤖 AI
  - DOMAIN-SUFFIX,hotjar.io,🤖 AI
  - DOMAIN-SUFFIX,posthog.com,🤖 AI
  - DOMAIN-SUFFIX,mixpanel.com,🤖 AI
  - DOMAIN-SUFFIX,google-analytics.com,🤖 AI
  - DOMAIN-SUFFIX,googletagmanager.com,🤖 AI

  # 可选出口探测：开启 Route Guard 出口探测前，取消下一条注释并使用同一组名
  # - DOMAIN,static.cloudflareinsights.com,🤖 AI

  # Anthropic IP 段
  - IP-CIDR,160.79.104.0/21,🤖 AI,no-resolve
  - IP-CIDR6,2607:6bc0::/48,🤖 AI,no-resolve

  # WebRTC 严格模式（默认关闭；Claude 目前不使用 WebRTC）
  # - DST-PORT,3478,🤖 AI
  # - DST-PORT,5349,🤖 AI
  # - DST-PORT,19302,🤖 AI

allow-lan: false
bind-address: 127.0.0.1

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
